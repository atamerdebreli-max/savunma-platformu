<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doküman Şablonları</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: block !important; padding: 0 !important; }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .panel-baslik {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
        }
        .geri-btn {
            background: rgba(0, 180, 216, 0.2);
            color: #00b4d8;
            border: 1px solid #00b4d8;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }
        .geri-btn:hover { background: #00b4d8; color: white; }

        .sablon-kapsayici {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
            max-width: 1200px;
        }

        .sidebar {
            background: rgba(255,255,255,0.04);
            border-radius: 15px;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        .sidebar-baslik {
            color: #00b4d8;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .kategori {
            margin-bottom: 20px;
        }
        .kategori-adi {
            color: #a8c5e0;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .sablon-link {
            display: block;
            padding: 10px 15px;
            color: #d1e3f0;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            cursor: pointer;
            margin-bottom: 5px;
        }
        .sablon-link:hover {
            background: rgba(0, 180, 216, 0.1);
            color: #00b4d8;
        }
        .sablon-link.aktif {
            background: rgba(0, 180, 216, 0.2);
            color: #00b4d8;
            font-weight: 600;
        }

        .icerik-alani {
            background: rgba(255,255,255,0.04);
            border-radius: 15px;
            padding: 30px;
            min-height: 600px;
        }
        .sablon-baslik {
            color: #00b4d8;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .sablon-aciklama {
            color: #a8c5e0;
            font-size: 14px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sablon-aksiyon {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }
        .btn-pdf {
            background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-pdf:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 180, 216, 0.4);
        }

        .sablon-icerik {
            background: white;
            color: #1a1a1a;
            padding: 40px;
            border-radius: 10px;
            line-height: 1.7;
            font-size: 14px;
        }
        .sablon-icerik h1 {
            font-size: 22px;
            color: #0a1929;
            border-bottom: 2px solid #00b4d8;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .sablon-icerik h2 {
            font-size: 18px;
            color: #0077b6;
            margin-top: 25px;
            margin-bottom: 12px;
        }
        .sablon-icerik h3 {
            font-size: 15px;
            color: #1a3a5c;
            margin-top: 18px;
            margin-bottom: 8px;
        }
        .sablon-icerik p {
            margin-bottom: 12px;
            color: #333;
        }
        .sablon-icerik ul, .sablon-icerik ol {
            margin: 12px 0;
            padding-left: 25px;
        }
        .sablon-icerik li {
            margin-bottom: 8px;
            color: #333;
        }
        .sablon-icerik table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 13px;
        }
        .sablon-icerik th {
            background: #0077b6;
            color: white;
            padding: 10px;
            text-align: left;
            border: 1px solid #005a8c;
        }
        .sablon-icerik td {
            padding: 10px;
            border: 1px solid #ddd;
            color: #333;
        }
        .sablon-icerik .bos-alan {
            background: #f9f9f9;
            padding: 15px;
            border: 1px dashed #999;
            border-radius: 5px;
            color: #666;
            font-style: italic;
            margin: 10px 0;
        }
        .sablon-icerik .not {
            background: #fff9e6;
            border-left: 4px solid #f0ad4e;
            padding: 12px 18px;
            margin: 15px 0;
            color: #856404;
            font-size: 13px;
            border-radius: 5px;
        }

        @media (max-width: 900px) {
            .sablon-kapsayici { grid-template-columns: 1fr; }
            .sidebar { position: static; }
        }

        @media print {
            body { background: white !important; }
            .panel-header, .sidebar, .sablon-aksiyon, .geri-btn { display: none !important; }
            .icerik-alani { background: white !important; padding: 0 !important; }
            .sablon-baslik, .sablon-aciklama { display: none !important; }
            .sablon-icerik { padding: 0 !important; }
            .sablon-kapsayici { grid-template-columns: 1fr; }
        }
    </style>
</head>

        // Sidebar'ı oluştur
        function sidebarOlustur() {
            const kategoriler = {};
            SABLONLAR.forEach(s => {
                if (!kategoriler[s.kategori]) kategoriler[s.kategori] = [];
                kategoriler[s.kategori].push(s);
            });

            let html = '';
            for (const [katAdi, sablonlar] of Object.entries(kategoriler)) {
                html += '<div class="kategori">';
                html += '<div class="kategori-adi">' + katAdi + '</div>';
                sablonlar.forEach(s => {
                    html += '<a class="sablon-link" data-id="' + s.id + '" onclick="sablonGoster(\'' + s.id + '\')">' + s.baslik + '</a>';
                });
                html += '</div>';
            }
            document.getElementById('sidebarIcerik').innerHTML = html;
        }

        // Şablon göster
        function sablonGoster(id) {
            const sablon = SABLONLAR.find(s => s.id === id);
            if (!sablon) return;

            // Aktif link
            document.querySelectorAll('.sablon-link').forEach(l => l.classList.remove('aktif'));
            document.querySelector('.sablon-link[data-id="' + id + '"]').classList.add('aktif');

                        let html = '';
            html += '<div class="sablon-baslik">' + sablon.baslik + '</div>';
            html += '<div class="sablon-aciklama">' + sablon.aciklama + '</div>';
            html += '<div class="sablon-aksiyon">';
            html += '<button class="btn-pdf" onclick="window.print()">📄 PDF Olarak İndir / Yazdır</button>';
            html += '<button class="btn-pdf" style="background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%); margin-left: 10px;" onclick="wordIndir(\'' + sablon.id + '\')">📥 Word Olarak İndir</button>';
            html += '</div>';
            html += '<div class="sablon-icerik">' + sablon.icerik + '</div>';
            document.getElementById('sablonIcerik').innerHTML = html;
        }

                  function wordIndir(sablonId) {
            const sablon = SABLONLAR.find(s => s.id === sablonId);
            if (!sablon) return;

            const htmlIcerik = 
                '<html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
                'xmlns:w="urn:schemas-microsoft-com:office:word" ' +
                'xmlns="http://www.w3.org/TR/REC-html40">' +
                '<head>' +
                '<meta charset="UTF-8">' +
                '<title>' + sablon.baslik + '</title>' +
                '<style>' +
                'body { font-family: Calibri, Arial, sans-serif; font-size: 11pt; line-height: 1.6; color: #000; }' +
                'h1 { font-size: 18pt; color: #0a1929; border-bottom: 2px solid #0077b6; padding-bottom: 8px; }' +
                'h2 { font-size: 14pt; color: #0077b6; margin-top: 20px; }' +
                'h3 { font-size: 12pt; color: #1a3a5c; }' +
                'p { margin: 8px 0; }' +
                'table { border-collapse: collapse; width: 100%; margin: 12px 0; }' +
                'th { background: #0077b6; color: white; padding: 8px; text-align: left; border: 1px solid #005a8c; }' +
                'td { padding: 8px; border: 1px solid #ddd; }' +
                '.bos-alan { background: #f9f9f9; padding: 12px; border: 1px dashed #999; margin: 10px 0; }' +
                '.not { background: #fff9e6; border-left: 4px solid #f0ad4e; padding: 12px; margin: 12px 0; }' +
                'ul, ol { margin: 10px 0; padding-left: 25px; }' +
                'li { margin-bottom: 6px; }' +
                '</style>' +
                '</head>' +
                '<body>' +
                sablon.icerik +
                '</body>' +
                '</html>';

            const blob = new Blob([htmlIcerik], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            
            const dosyaAdi = sablon.baslik
                .replace(/[📌📘📁🗂️📊🔧🔍🌡️📈🏷️📋📏🚚👥🎓✏️⚠️]/g, '')
                .replace(/^\s+/, '')
                .replace(/\s+/g, '_') + '.doc';

            const a = document.createElement('a');
            a.href = url;
            a.download = dosyaAdi;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            alert('📥 Word dosyası indirildi: ' + dosyaAdi + '\n\nAçarken "Farklı Kaydet" uyarısı çıkabilir. "Evet" deyin.');
        }

        // Başlangıç
        window.addEventListener('DOMContentLoaded', () => {
            const kullaniciStr = localStorage.getItem('kullanici');
            if (!kullaniciStr) {
                window.location.href = 'giris.html';

            }

        });
