<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana Yüklenici Girişi - UyumOS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #1a3a5c 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .kart {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 45px 40px;
            width: 100%;
            max-width: 420px;
        }
        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .logo span { color: #00b4d8; }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 30px;
            color: #a8c5e0;
            font-weight: 500;
        }
        .form-grup { margin-bottom: 20px; }
        .form-grup label {
            display: block;
            color: #a8c5e0;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-grup input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 15px;
        }
        .form-grup input:focus {
            outline: none;
            border-color: #00b4d8;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { opacity: 0.9; }
        .hata {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #ef4444;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .alt-link {
            text-align: center;
            margin-top: 20px;
            color: #a8c5e0;
            font-size: 14px;
        }
        .alt-link a { color: #00b4d8; text-decoration: none; }
        .alt-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="kart">
        <div class="logo">🛡️ Uyum<span>OS</span></div>
        <h1>Ana Yüklenici Girişi</h1>

        <div class="hata" id="hata"></div>

        <div class="form-grup">
            <label>E-posta</label>
            <input type="email" id="email" placeholder="ornek@sirket.com">
        </div>

        <div class="form-grup">
            <label>Şifre</label>
            <input type="password" id="sifre" placeholder="••••••••">
        </div>

        <button class="btn" onclick="girisYap()">Giriş Yap →</button>

        <div class="alt-link">
            Hesabınız yok mu? <a href="ana-yuklenici-basvuru.html">Başvurun</a>
        </div>
    </div>

    <script>
        const API = window.location.origin;

        async function girisYap() {
            const email = document.getElementById('email').value.trim();
            const sifre = document.getElementById('sifre').value;
            const hata = document.getElementById('hata');
            hata.style.display = 'none';

            if (!email || !sifre) {
                hata.textContent = 'E-posta ve şifre gereklidir.';
                hata.style.display = 'block';
                return;
            }

            try {
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', sifre);

                const r = await fetch(API + '/ana-yuklenici/giris', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: formData
                });
                const data = await r.json();

                if (r.ok) {
                    localStorage.setItem('ana_yuklenici_token', data.access_token);
                    localStorage.setItem('ana_yuklenici_id', data.ana_yuklenici.id);
                    localStorage.setItem('ana_yuklenici_sirket', data.ana_yuklenici.sirket_adi);
                    window.location.href = 'ana-yuklenici-panel.html';
                } else {
                    hata.textContent = data.detail || 'Giriş yapılamadı.';
                    hata.style.display = 'block';
                }
            } catch (e) {
                hata.textContent = 'Bağlantı hatası.';
                hata.style.display = 'block';
            }
        }

        document.getElementById('sifre').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') girisYap();
        });
    </script>
</body>
</html>
