<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .admin-baslik {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
        }
        .cikis-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .cikis-btn:hover { background: #ef4444; color: white; }

        .ozet-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .ozet-kart {
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border-left: 5px solid #00b4d8;
        }
        .ozet-sayi {
            font-size: 42px;
            font-weight: bold;
            color: #00b4d8;
        }
        .ozet-baslik {
            font-size: 14px;
            color: #a8c5e0;
            margin-top: 8px;
        }

        .tab-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: rgba(255,255,255,0.05);
            color: #a8c5e0;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #00b4d8;
            color: white;
            border-color: #00b4d8;
        }

        .tab-icerik {
            background: rgba(255,255,255,0.03);
            padding: 25px;
            border-radius: 15px;
            text-align: left;
            overflow-x: auto;
        }

        .veri-tablo {
            width: 100%;
            border-collapse: collapse;
        }
        .veri-tablo th {
            color: #00b4d8;
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid rgba(0, 180, 216, 0.3);
            font-size: 14px;
        }
        .veri-tablo td {
            color: #ffffff;
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }
        .veri-tablo tr:hover td {
            background: rgba(0, 180, 216, 0.05);
        }
        .skor-iyi { color: #4ade80; font-weight: bold; }
        .skor-orta { color: #fbbf24; font-weight: bold; }
        .skor-zayif { color: #ef4444; font-weight: bold; }
        .durum-beklemede { color: #fbbf24; font-weight: bold; }
        .durum-arandi { color: #4ade80; font-weight: bold; }
        .durum-tamamlandi { color: #00b4d8; font-weight: bold; }

                @media (max-width: 768px) {
            /* Container genişlet */
            .container {
                max-width: 100% !important;
                padding: 10px !important;
                margin: 0 !important;
                width: 100% !important;
            }
            
            /* Header dikey */
            .admin-header {
                flex-direction: column !important;
                gap: 12px !important;
                text-align: center !important;
                padding: 10px 0 !important;
            }
            .admin-baslik {
                font-size: 20px !important;
                word-break: break-word !important;
            }
            .cikis-btn {
                width: 100% !important;
                padding: 12px !important;
                font-size: 14px !important;
            }
            
            /* Özet kutuları */
            .ozet-grid {
                grid-template-columns: 1fr 1fr !important;
                gap: 10px !important;
            }
            .ozet-kart {
                padding: 15px 8px !important;
            }
            .ozet-sayi {
                font-size: 26px !important;
            }
            .ozet-baslik {
                font-size: 11px !important;
                line-height: 1.3 !important;
            }
            
            /* Sekmeler — YATAY KAYDIRMA */
            .tab-menu {
                display: flex !important;
                flex-wrap: nowrap !important;
                overflow-x: auto !important;
                gap: 8px !important;
                padding-bottom: 10px !important;
                -webkit-overflow-scrolling: touch !important;
            }
            .tab-btn {
                flex-shrink: 0 !important;
                font-size: 13px !important;
                padding: 10px 14px !important;
                white-space: nowrap !important;
            }
            
            /* Tablo — YATAY KAYDIRMA */
            .tab-icerik {
                padding: 10px !important;
                overflow-x: auto !important;
                -webkit-overflow-scrolling: touch !important;
            }
            .veri-tablo {
                font-size: 11px !important;
                min-width: 600px !important;
            }
            .veri-tablo th, .veri-tablo td {
                padding: 6px 8px !important;
                white-space: nowrap !important;
            }
        }
        
        @media (max-width: 400px) {
            .ozet-grid {
                grid-template-columns: 1fr !important;
            }
            .ozet-sayi {
                font-size: 32px !important;
            }
            .admin-baslik {
                font-size: 18px !important;
            }
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 1200px;">
        <div class="admin-header">
            <div class="admin-baslik">🔐 Admin Paneli</div>
            <button class="cikis-btn" onclick="cikisYap()">Çıkış Yap</button>
        </div>

        <div class="ozet-grid">
            <div class="ozet-kart">
                <div class="ozet-sayi" id="toplamKullanici">-</div>
                <div class="ozet-baslik">Kullanıcı</div>
            </div>
            <div class="ozet-kart">
                <div class="ozet-sayi" id="toplamAssessment">-</div>
                <div class="ozet-baslik">Assessment</div>
            </div>
            <div class="ozet-kart">
                <div class="ozet-sayi" id="toplamTalep">-</div>
                <div class="ozet-baslik">Danışmanlık Talebi</div>
            </div>
            <div class="ozet-kart" style="border-left-color: #ef4444;">
                <div class="ozet-sayi" id="bekleyenTalep" style="color: #ef4444;">-</div>
                <div class="ozet-baslik">Bekleyen Talep</div>
            </div>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" onclick="sekmeGoster('kullanicilar', this)">
                👥 Kullanıcılar
            </button>
            <button class="tab-btn" onclick="sekmeGoster('assessmentlar', this)">
                📊 Assessment'lar
            </button>
            <button class="tab-btn" onclick="sekmeGoster('talepler', this)">
                📞 Danışmanlık Talepleri
            </button>
        </div>

        <div id="tabIcerik" class="tab-icerik">
            Yükleniyor...
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
