<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eğitimler - UyumOS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #1a3a5c 100%);
            color: #fff;
            min-height: 100vh;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(0,0,0,0.25);
        }
        .navbar-logo { font-size: 20px; font-weight: 700; color: #fff; text-decoration: none; }
        .navbar-logo span { color: #00b4d8; }
        .navbar-links a {
            color: #a8c5e0;
            text-decoration: none;
            font-size: 14px;
            margin-left: 20px;
        }
        .navbar-links a:hover { color: #00b4d8; }
        .kapsayici { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        h1 { font-size: 36px; margin-bottom: 10px; }
        .alt-baslik { color: #a8c5e0; margin-bottom: 30px; }

        .filtre {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .filtre button {
            padding: 10px 22px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: #a8c5e0;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .filtre button:hover { border-color: #00b4d8; color: #00b4d8; }
        .filtre button.aktif {
            background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
            color: #fff;
            border-color: transparent;
        }

        .egitim-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
        }
        .egitim-kart {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }
        .egitim-kart:hover {
            border-color: rgba(0,180,216,0.4);
            transform: translateY(-5px);
        }
        .egitim-ust {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        .kategori-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(0,180,216,0.15);
            color: #00b4d8;
        }
        .seviye-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .seviye-baslangic { background: rgba(74,222,128,0.15); color: #4ade80; }
        .seviye-orta { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .seviye-ileri { background: rgba(239,68,68,0.15); color: #ef4444; }

        .egitim-baslik {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        .egitim-aciklama {
            color: #a8c5e0;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
            flex: 1;
        }
        .egitim-bilgi {
            display: flex;
            gap: 15px;
            color: #a8c5e0;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .egitim-alt {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .fiyat {
            font-size: 18px;
            font-weight: 700;
            color: #00b4d8;
        }
        .fiyat.ucretsiz { color: #4ade80; }
        .btn-kucuk {
            background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
            color: #fff;
            padding: 10px 22px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            border: none;
            cursor: pointer;
        }
        .bos-mesaj {
            text-align: center;
            color: #a8c5e0;
            padding: 60px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-logo">🛡️ Uyum<span>OS</span></a>
        <div class="navbar-links">
            <a href="panel.html">Panel</a>
            <a href="egitimler.html">Eğitimler</a>
            <a href="egitimlerim.html">Eğitimlerim</a>
            <a href="uzmanlar.html">Uzmanlar</a>
        </div>
    </nav>

    <div class="kapsayici">
        <h1>Eğitim Modülleri</h1>
        <p class="alt-baslik">FAI, FOD, YETEN ve AS9100 konularında uzman eğitimler. Video + Quiz + Sertifika.</p>

        <div class="filtre">
            <button class="aktif" onclick="filtrele('', this)">Tümü</button>
            <button onclick="filtrele('FAI', this)">FAI</button>
            <button onclick="filtrele('FOD', this)">FOD</button>
            <button onclick="filtrele('YETEN', this)">YETEN</button>
            <button onclick="filtrele('AS9100', this)">AS9100</button>
            <button onclick="filtrele('EYDEP', this)">EYDEP</button>
        </div>

        <div class="egitim-grid" id="egitim-grid">
            <div class="bos-mesaj">Yükleniyor...</div>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        let aktifKategori = '';

        async function egitimleriYukle() {
            const grid = document.getElementById('egitim-grid');
            let url = API + '/egitimler';
            if (aktifKategori) url += '?kategori=' + aktifKategori;

            try {
                const r = await fetch(url);
                const data = await r.json();

                if (!data.egitimler || data.egitimler.length === 0) {
                    grid.innerHTML = '<div class="bos-mesaj">Bu kategoride eğitim bulunmuyor. Yakında eklenecek.</div>';
                    return;
                }

                grid.innerHTML = data.egitimler.map(e => `
                    <div class="egitim-kart">
                        <div class="egitim-ust">
                            <span class="kategori-badge">${e.kategori}</span>
                            <span class="seviye-badge seviye-${e.seviye}">${e.seviye.toUpperCase()}</span>
                        </div>
                        <div class="egitim-baslik">${e.baslik}</div>
                        <div class="egitim-aciklama">${e.aciklama || 'Açıklama yakında eklenecek.'}</div>
                        <div class="egitim-bilgi">
                            <span>⏱️ ${e.sure_dakika} dk</span>
                        </div>
                        <div class="egitim-alt">
                            <span class="fiyat ${e.fiyat === 0 ? 'ucretsiz' : ''}">
                                ${e.fiyat === 0 ? 'Ücretsiz' : e.fiyat.toLocaleString('tr-TR') + ' TL'}
                            </span>
                            <a href="egitim-detay.html?id=${e.id}" class="btn-kucuk">Başla →</a>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                grid.innerHTML = '<div class="bos-mesaj">Eğitimler yüklenemedi.</div>';
            }
        }

        function filtrele(kategori, btn) {
            aktifKategori = kategori;
            document.querySelectorAll('.filtre button').forEach(b => b.classList.remove('aktif'));
            btn.classList.add('aktif');
            egitimleriYukle();
        }

        egitimleriYukle();
    </script>
</body>
</html>
